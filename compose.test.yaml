name: pet-reporting-test
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petreport_test
      POSTGRES_USER: petreport_test
      POSTGRES_PASSWORD: ephemeral-test-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U petreport_test -d petreport_test']
      interval: 2s
      timeout: 2s
      retries: 30
  tests:
    build:
      context: .
      target: test
    environment:
      PETREPORT_CONFIG: /app/tests/config.yaml
      PETREPORT_SECRETS: /nonexistent
      TEST_DATABASE: '1'
    depends_on:
      postgres:
        condition: service_healthy
